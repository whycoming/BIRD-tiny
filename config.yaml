# BIRD + SD 2.1 for IR Blind Enhancement (Path A: No LoRA)
# 所有可调参数集中在此。运行时 CLI 可以覆盖部分字段 (见 --help)。

# ---------------------------------------------------------------------
# 模型相关
# ---------------------------------------------------------------------
model:
  model_id: "stabilityai/stable-diffusion-2-1-base"
  dtype: "float16"
  device: "cuda"
  # 推理时的 text prompt.
  #   ""                                  -> null prompt (SD 2.1 base unconditional 质量极差, 不要用)
  #   "a high quality black and white photograph" -> 灰度偏置 + 非空, 质量显著提升
  #   "infrared thermal image, grayscale"           -> 更强的 IR 域偏置 (效果有限)
  # 重要: SD 2.1 base 在空 prompt + 无 CFG + 短 DDIM 下会直接输出伪影.
  prompt: "a high quality black and white photograph"

# ---------------------------------------------------------------------
# I/O 相关 (支持任意宽高比)
# ---------------------------------------------------------------------
io:
  # 处理分辨率: 长边的目标像素数. 短边按原宽高比自动计算.
  # 两个维度最终都会被 round 到 8 的倍数 (VAE 要求).
  # 建议范围: 384-768. 太大会爆显存, 太小损失细节.
  # SD 2.1 base 原生 512, 长边设 512 是 sweet spot.
  long_edge: 512

  # 长边硬上限, 防止极端大图爆显存 (即使 long_edge 设得更大也会 clamp).
  max_long_edge: 768

  # 是否把输出 resize 回原图尺寸 (false 则保留处理分辨率).
  restore_original_size: true

  # 是否强制把 SD 处理分辨率 pad 成正方形 (推荐 true).
  # SD 2.1 base 训练时严格 512x512, 非正方形会产生伪影. 开启后流程是:
  #   1) AR-preserving resize 到能塞进 s×s 的尺寸 (s=long_edge)
  #   2) reflect pad 到 s×s 给 SD 处理
  #   3) 输出 crop 回内容区, 再 resize 回原图
  force_square: true

# ---------------------------------------------------------------------
# BIRD 联合优化
# ---------------------------------------------------------------------
optimization:
  num_steps: 500
  num_ddim_steps: 10
  warm_start_steps: 100
  # lr_z 从 0.01 降到 0.001: 原值在无 z_T 正则 + 500 步下会把 z_T 漂出高斯流形,
  # 配合新加的 z_T 高斯正则 + 这里的降档可以稳住.
  lr_z: 0.001
  lr_theta: 0.01
  grad_clip_norm: 1.0
  seed: 42

# ---------------------------------------------------------------------
# 复合退化模型
# ---------------------------------------------------------------------
degradation:
  # Generic blur kernel 大小 (K x K, 方形)
  kernel_size: 21

  # Gamma 校正
  enable_gamma: true

  # FPN (Fixed Pattern Noise), 低秩分解 H×r + r×W (自适应非方形)
  enable_fpn: true
  fpn_rank: 4

# ---------------------------------------------------------------------
# 正则项权重
# ---------------------------------------------------------------------
regularization:
  kernel_l1: 0.001
  gamma_deviation: 0.1
  fpn_l2: 0.01
