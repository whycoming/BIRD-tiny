# BIRD + SD 2.1 for IR Blind Enhancement (Path A: No LoRA)
# 所有可调参数集中在此。运行时 CLI 可以覆盖部分字段 (见 --help)。

# ---------------------------------------------------------------------
# 模型相关
# ---------------------------------------------------------------------
model:
  model_id: "stabilityai/stable-diffusion-2-1-base"
  dtype: "float16"
  device: "cuda"
  # 推理时的 text prompt.
  #   ""                                  -> null prompt (最干净, 推荐起点)
  #   "grayscale photo, monochrome"       -> 弱的灰度引导
  #   "infrared thermal image, grayscale" -> 更强的 IR 域偏置 (效果有限)
  prompt: ""

# ---------------------------------------------------------------------
# I/O 相关 (支持任意宽高比)
# ---------------------------------------------------------------------
io:
  # 处理分辨率: 长边的目标像素数. 短边按原宽高比自动计算.
  # 两个维度最终都会被 round 到 8 的倍数 (VAE 要求).
  # 建议范围: 384-768. 太大会爆显存, 太小损失细节.
  # SD 2.1 base 原生 512, 长边设 512 是 sweet spot.
  long_edge: 512

  # 长边硬上限, 防止极端大图爆显存 (即使 long_edge 设得更大也会 clamp).
  max_long_edge: 768

  # 是否把输出 resize 回原图尺寸 (false 则保留处理分辨率).
  restore_original_size: true

# ---------------------------------------------------------------------
# BIRD 联合优化
# ---------------------------------------------------------------------
optimization:
  num_steps: 500
  num_ddim_steps: 10
  warm_start_steps: 100
  lr_z: 0.01
  lr_theta: 0.01
  grad_clip_norm: 1.0
  seed: 42

# ---------------------------------------------------------------------
# 复合退化模型
# ---------------------------------------------------------------------
degradation:
  # Generic blur kernel 大小 (K x K, 方形)
  kernel_size: 21

  # Gamma 校正
  enable_gamma: true

  # FPN (Fixed Pattern Noise), 低秩分解 H×r + r×W (自适应非方形)
  enable_fpn: true
  fpn_rank: 4

# ---------------------------------------------------------------------
# 正则项权重
# ---------------------------------------------------------------------
regularization:
  kernel_l1: 0.001
  gamma_deviation: 0.1
  fpn_l2: 0.01
